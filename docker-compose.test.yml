# Entorno de pruebas/CI con las imágenes de producción (target `runtime`):
#   docker compose -f docker-compose.test.yml up --build --wait
# La base es efímera (tmpfs); las credenciales no son secretas y se pueden sobrescribir por entorno.
name: sol-a-sol-test

x-database-url: &database-url postgresql://${POSTGRES_USER:-sol_a_sol}:${POSTGRES_PASSWORD:-sol_a_sol_test}@db:5432/${POSTGRES_DB:-sol_a_sol_test}?schema=public

services:
  db:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sol_a_sol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sol_a_sol_test}
      POSTGRES_DB: ${POSTGRES_DB:-sol_a_sol_test}
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime
    environment:
      DATABASE_URL: *database-url
    ports:
      - 127.0.0.1:${API_PORT:-3001}:3001
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: runtime
    environment:
      API_URL: http://api:3001
    ports:
      - 127.0.0.1:${WEB_PORT:-3000}:3000
    depends_on:
      api:
        condition: service_healthy
