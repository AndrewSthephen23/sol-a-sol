# Entorno de desarrollo: `docker compose up --build` (o `pnpm dev`).
# Requiere un `.env` en la raíz (copiar `.env.example`).
name: sol-a-sol

x-database-url: &database-url postgresql://${POSTGRES_USER:?Define POSTGRES_USER en .env}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:?Define POSTGRES_DB en .env}?schema=public

services:
  db:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      # PostgreSQL 18 guarda los datos bajo /var/lib/postgresql/<versión>/docker.
      - db-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Por TCP: durante la inicialización el servidor temporal solo escucha en el socket Unix.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    environment:
      DATABASE_URL: *database-url
      PORT: 3001
    # Aplica/crea migraciones, genera el cliente y arranca en modo watch.
    command: sh -c "pnpm exec prisma migrate dev && pnpm exec prisma generate && pnpm exec nest start --watch"
    ports:
      - 127.0.0.1:${API_PORT:-3001}:3001
    volumes:
      - ./apps/api/src:/repo/apps/api/src
      - ./apps/api/prisma:/repo/apps/api/prisma
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: dev
    environment:
      # URL interna de la API para llamadas desde el servidor de Next.js (se usará desde H2).
      API_URL: http://api:3001
    ports:
      - 127.0.0.1:${WEB_PORT:-3000}:3000
    volumes:
      - ./apps/web/src:/repo/apps/web/src
    depends_on:
      api:
        condition: service_healthy

  adminer:
    profiles: [tools]
    image: adminer:5.5.1
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    profiles: [tools]
    image: axllent/mailpit:v1.31.1
    ports:
      - 127.0.0.1:8025:8025 # interfaz web
      - 127.0.0.1:1025:1025 # SMTP

volumes:
  db-data:
