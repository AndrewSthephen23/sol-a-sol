# SonarQube Cloud (antes SonarCloud). El análisis corre en ci.yml.
# Si la organización o el key del proyecto cambian al crearlo, ajustar aquí.
sonar.projectKey=AndrewSthephen23_sol-a-sol
sonar.organization=andrewsthephen23
sonar.projectName=Sol a Sol

# Código analizado
sonar.sources=apps,packages
sonar.tests=apps
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,apps/api/test/**/*.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,apps/api/src/generated/**,**/*.spec.ts,**/*.spec.tsx

# Cobertura (lcov generado por Vitest)
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.tsx,apps/api/test/**,apps/api/src/main.ts,apps/api/src/generated/**,**/*.config.{ts,js,mjs}

sonar.sourceEncoding=UTF-8
