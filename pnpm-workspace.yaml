packages:
  - apps/*
  - packages/*

saveExact: true
engineStrict: true

# Parches de seguridad en dependencias transitivas. Revisar (y quitar si ya no aplica)
# cada vez que se actualice el paquete que las trae.
overrides:
  # Las dos siguientes llegan por la CLI de Prisma, que desde el issue #6 ya no viaja en la imagen
  # de producción (`deploy --prod --no-optional`): solo afectan al entorno de desarrollo y a CI,
  # donde `pnpm audit --audit-level high` las bloquea.
  # prisma@7.10.0 fija mysql2@3.15.3. GHSA-3f6p-5ww8-9rcr (high) y GHSA-rgwj-5xj2-c3m3 (moderate).
  mysql2: 3.24.4
  # @prisma/config@7.10.0 (CLI) fija deepmerge-ts@7.1.5. GHSA-ggr8-5vv4-36mx (high), corregido en 8.x.
  # Mayor compatible con su uso (combinar objetos de configuración planos); validado con
  # prisma validate/generate y migrate deploy en las pruebas de integración.
  deepmerge-ts: 8.0.2
  # typed-rest-client@2.3.1 (dependencia de @stryker-mutator/core, solo desarrollo) fija qs@6.15.1.
  # GHSA-q8mj-m7cp-5q26, GHSA-x5fp-wj9c-mxmx y GHSA-4mjr-xmp4-gh2g (moderate), corregidos en 6.16.0
  # (misma versión mayor); validado corriendo Stryker.
  qs: 6.16.0

# Solo se ejecutan scripts de instalación explícitamente aprobados (revisados uno por uno).
allowBuilds:
  # Descarga el schema engine que usan `prisma migrate` y `prisma studio`.
  '@prisma/engines': true
  # Solo verifica la versión de Node (ya garantizada por `engines`).
  prisma: false
  # Binario nativo vía dependencias opcionales; el script no es necesario.
  '@swc/core': false
  # `node-gyp-build` resuelve el binario precompilado que el propio paquete trae en `prebuilds/`
  # al importarlo, así que el script de instalación no hace falta: comprobado hasheando y
  # verificando con la instalación hecha con los scripts desactivados.
  argon2: false
  unrs-resolver: false
  # Dependencias transitivas de Testcontainers: aceleración nativa opcional de SSH
  # (ssh2 tiene implementación en JS) y un aviso de versión de protobufjs.
  cpu-features: false
  ssh2: false
  protobufjs: false
# Parches a dependencias. Cada uno debe quitarse cuando exista la corrección oficial.
patchedDependencies:
  # Con Vitest 5, el runner de Stryker filtra las pruebas por nombre uniendo la cadena
  # describe/it con espacios, pero Vitest compara contra la cadena unida con ' > ': no se ejecuta
  # ninguna prueba por mutante y todos "sobreviven". Upstream: stryker-js#6210. Seguimiento: issue #14.
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
