name: Setup pnpm y Node.js
description: >-
  Instala pnpm (versión de `packageManager`) y Node.js (`.nvmrc`) con caché del store de pnpm
  y, opcionalmente, las dependencias con el lockfile congelado.

inputs:
  install:
    description: Ejecutar `pnpm install --frozen-lockfile`.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Instalar pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Instalar Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Instalar dependencias
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
