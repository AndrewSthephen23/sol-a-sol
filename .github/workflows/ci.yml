name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: '0'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  # Trivy fijado por versión y digest (no se usa trivy-action: menos superficie de cadena de suministro).
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  commitlint:
    name: Commits (commitlint)
    # Dependabot genera cuerpos con líneas largas; sus mensajes se validan al hacer squash merge.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validar mensajes de commit del PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  changeset:
    name: Changeset
    # Dependabot no escribe changesets y los PR de release (release/vX.Y.Z) los consumen.
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: El PR incluye un changeset si cambia algún paquete
        # Si el cambio no necesita versión: `pnpm changeset --empty`.
        run: pnpm exec changeset status --since=origin/main

  quality:
    name: Formato, lint y tipos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Formato (Prettier)
        run: pnpm format:check
      - name: Lint (ESLint)
        run: pnpm lint
      - name: Tipos (TypeScript)
        run: pnpm typecheck

  unit:
    name: Pruebas unitarias
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Vitest con cobertura
        run: pnpm turbo run test -- --coverage
      - name: Publicar reportes de cobertura
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Pruebas de integración
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Vitest + Testcontainers (PostgreSQL real)
        run: pnpm test:integration

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build de web y API
        run: pnpm build

  docker:
    name: Imágenes Docker (build, Trivy y smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker-compose.test.yml
      TRIVY_DB_REPOSITORIES: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build de imágenes de producción
        run: docker compose build

      - name: Trivy — reporte HIGH/CRITICAL
        run: |
          for image in sol-a-sol-test-api sol-a-sol-test-web; do
            echo "::group::$image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/" \
              "$TRIVY_IMAGE" image --quiet --scanners vuln \
              --db-repository "$TRIVY_DB_REPOSITORIES" \
              --severity HIGH,CRITICAL --exit-code 0 "$image:latest"
            echo "::endgroup::"
          done

      - name: Trivy — bloquea vulnerabilidades CRITICAL con corrección disponible
        run: |
          for image in sol-a-sol-test-api sol-a-sol-test-web; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/" \
              "$TRIVY_IMAGE" image --quiet --scanners vuln --skip-db-update \
              --severity CRITICAL --ignore-unfixed --exit-code 1 "$image:latest"
          done

      - name: Levantar entorno de producción (up --wait)
        run: docker compose up --wait --wait-timeout 180

      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3001/health/ready
          echo
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/
          echo "web OK"

      - name: Logs de contenedores
        if: failure()
        run: docker compose logs --no-color

      - name: Apagar entorno
        if: always()
        run: docker compose down --volumes

  sonarcloud:
    name: SonarQube Cloud (quality gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # El contexto `secrets` no se puede usar en el `if` de un job: se expone aquí
      # para que los pasos se salten mientras el proyecto no esté conectado (ver README).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historial completo: Sonar lo usa para atribuir código nuevo (new code).
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: env.SONAR_TOKEN != ''
      - name: Cobertura para el análisis
        if: env.SONAR_TOKEN != ''
        run: pnpm turbo run test -- --coverage
      # Controllers y repositorios se prueban contra PostgreSQL real, no en las unitarias: sin
      # esta cobertura Sonar los vería sin probar. Va después de las unitarias, que limpian su
      # carpeta `coverage/` al empezar.
      - name: Cobertura de integración para el análisis
        if: env.SONAR_TOKEN != ''
        run: pnpm turbo run test:integration -- --coverage
      - name: Versión del producto
        id: version
        if: env.SONAR_TOKEN != ''
        # Con la definición de código nuevo "Previous version", Sonar compara contra la versión anterior.
        run: echo "version=$(node -p "require('./apps/api/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Análisis y quality gate (bloqueante)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.projectVersion=${{ steps.version.outputs.version }}
      - name: Aviso si SonarQube Cloud no está configurado
        if: env.SONAR_TOKEN == ''
        run: echo "::warning title=SonarQube Cloud::Falta el secreto SONAR_TOKEN; el análisis se omitió (ver README)."

  ci-ok:
    name: CI OK
    # Check único para la protección de rama: falla si algún job falló o se canceló.
    if: always()
    needs: [commitlint, changeset, quality, unit, integration, build, docker, sonarcloud]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verificar resultado de los jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              exit 1
            fi
          done
