name: Mutation testing

# Stryker sobre @sol-a-sol/domain: falla si el mutation score baja del umbral `break`
# de stryker.config.json. Corre en PRs que tocan el dominio y cada noche.
on:
  pull_request:
    paths:
      - packages/domain/**
      - pnpm-lock.yaml
  schedule:
    # 03:00 en Lima (UTC-5)
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: '0'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  domain:
    name: Mutation testing (domain)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Stryker
        run: pnpm turbo run test:mutation --filter=@sol-a-sol/domain
      - name: Publicar reporte de mutación
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: packages/domain/reports/mutation/
          if-no-files-found: ignore
          retention-days: 14
